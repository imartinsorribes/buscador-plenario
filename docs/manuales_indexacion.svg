  <polygon points="818,307 805,300 805,314" fill="#8b2440"/>
  <line x1="695" y1="522" x2="808" y2="335" stroke="#8b2440" stroke-width="3"/>
  <polygon points="813,326 813,340 801,332" fill="#8b2440"/>

  <!-- cilindro ChromaDB -->
  <g>
    <path d="M1230,270 L1230,380 A105,26 0 0 0 1440,380 L1440,270" fill="#ddeee4" stroke="#9cc4ab" stroke-width="2.5"/>
    <ellipse cx="1335" cy="270" rx="105" ry="26" fill="#e9f4ee" stroke="#9cc4ab" stroke-width="2.5"/>
    <text x="1335" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="bold" fill="#1d6b4f">ChromaDB</text>
  </g>
  <text x="1335" y="450" text-anchor="middle" font-size="13.5" fill="#7a7a7a">929 fragmentos · texto + capturas + vídeo</text>
  <text x="1335" y="474" text-anchor="middle" font-size="13.5" fill="#7a7a7a">recarga en caliente: subir un PDF no reinicia nada</text>

  <line x1="1125" y1="307" x2="1212" y2="315" stroke="#1d6b4f" stroke-width="3"/>
  <polygon points="1222,316 1209,309 1208,323" fill="#1d6b4f"/>
