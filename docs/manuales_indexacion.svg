  <!-- fuente: manuales PDF -->
  <path d="M95,150 L195,150 L222,177 L222,285 L95,285 Z" fill="#f7ecc3" stroke="#d9b95e" stroke-width="2"/>
  <path d="M195,150 L195,177 L222,177" fill="#eeddad" stroke="#d9b95e" stroke-width="2"/>
