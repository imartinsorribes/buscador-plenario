  <text x="970" y="330" text-anchor="middle" font-size="13.5" fill="#8a6a70">BGE-M3 · un solo espacio vectorial</text>

  <line x1="695" y1="157" x2="808" y2="285" stroke="#8b2440" stroke-width="3"/>
  <polygon points="815,293 803,289 811,278" fill="#8b2440"/>
