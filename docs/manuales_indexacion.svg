  <rect x="360" y="470" width="330" height="105" fill="#f7e3e6" stroke="#d9a3ad" stroke-width="2" rx="12"/>
  <text x="525" y="513" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#8b2440">Ventanas por minuto</text>
  <text x="525" y="545" text-anchor="middle" font-size="13.5" fill="#8a6a70">Whisper turbo · cita = minuto exacto</text>

