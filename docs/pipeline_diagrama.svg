  <rect x="1130" y="460" width="520" height="70" fill="#fff" stroke="#7a1f2b" rx="6"/>
  <text x="1390" y="487" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">SQLite</text>
  <text x="1390" y="508" text-anchor="middle" font-size="12" fill="#6b665e">entidades · plenos · roster · huellas · suscripciones y bandeja de alertas</text>

  <!-- ============ BANDA 4: APLICACIÓN ============ -->
  <text x="30" y="578" font-size="12" fill="#7a1f2b" letter-spacing="2">APLICACIÓN WEB (FastAPI · 6 pestañas)</text>
  <rect x="30" y="590" width="255" height="150" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="157" y="614" text-anchor="middle" font-size="14" fill="#7a1f2b" font-weight="bold">Generar acta</text>
  <text x="42" y="638" font-size="11.5" fill="#454139">· pegar URL → acta automática</text>
  <text x="42" y="656" font-size="11.5" fill="#454139">· editor de voces con reproductor</text>
  <text x="42" y="674" font-size="11.5" fill="#454139">· acta PDF estilo Diario</text>
  <text x="42" y="692" font-size="11.5" fill="#454139">· búsqueda de intervenciones 0,3 s</text>
  <text x="42" y="710" font-size="11.5" fill="#454139">· salto al minuto del vídeo</text>

  <rect x="305" y="590" width="255" height="150" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="432" y="614" text-anchor="middle" font-size="14" fill="#7a1f2b" font-weight="bold">Registro de voces</text>
  <text x="317" y="638" font-size="11.5" fill="#454139">· alta de huella por entidad</text>
  <text x="317" y="656" font-size="11.5" fill="#454139">· sugerencia automática de orador</text>
  <text x="317" y="674" font-size="11.5" fill="#454139">· pureza 100 % medida, 0 falsos</text>
  <text x="317" y="692" font-size="11.5" fill="#454139">· RGPD: vector local, borrable</text>

  <rect x="580" y="590" width="255" height="150" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="707" y="614" text-anchor="middle" font-size="14" fill="#7a1f2b" font-weight="bold">Buscar</text>
  <text x="592" y="638" font-size="11.5" fill="#454139">· corpus Congreso en lenguaje</text>
  <text x="592" y="656" font-size="11.5" fill="#454139">  natural + evolución temporal</text>
  <text x="592" y="674" font-size="11.5" fill="#454139">· respuesta con fuentes citadas</text>
  <text x="592" y="692" font-size="11.5" fill="#454139">· orador · grupo · pleno</text>

  <rect x="855" y="590" width="285" height="150" fill="#fff" stroke="#7a1f2b" stroke-width="1.6" rx="6"/>
  <text x="997" y="614" text-anchor="middle" font-size="14" fill="#7a1f2b" font-weight="bold">Manuales (SEDIPUALBA)</text>
  <text x="867" y="636" font-size="11.5" fill="#454139">· citas clicables [n · manual p.X]</text>
  <text x="867" y="653" font-size="11.5" fill="#454139">· chat de dudas + clip PANTALLAZO:</text>
  <text x="867" y="670" font-size="11.5" fill="#454139">  "dónde estoy y paso siguiente"</text>
  <text x="867" y="687" font-size="11.5" fill="#454139">· subir PDF · indexar vídeo tutorial</text>
  <text x="867" y="704" font-size="11.5" fill="#454139">· ficha PDF · feedback · valencià</text>
  <text x="867" y="721" font-size="11.5" fill="#454139">· 16/16 fuentes · 15/15 citas válidas</text>

  <rect x="1160" y="590" width="235" height="150" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="1277" y="614" text-anchor="middle" font-size="14" fill="#7a1f2b" font-weight="bold">Ciudadano</text>
  <text x="1172" y="638" font-size="11.5" fill="#454139">· dashboard del Congreso</text>
  <text x="1172" y="656" font-size="11.5" fill="#454139">  en datos (KPIs)</text>

  <rect x="1415" y="590" width="235" height="150" fill="#fff" stroke="#7a1f2b" stroke-width="1.6" rx="6"/>
  <text x="1532" y="614" text-anchor="middle" font-size="14" fill="#7a1f2b" font-weight="bold">Alertas (vecinos)</text>
  <text x="1427" y="638" font-size="11.5" fill="#454139">· suscripción por temas o boletín</text>
  <text x="1427" y="656" font-size="11.5" fill="#454139">· correo: cita + minuto + acta</text>
  <text x="1427" y="674" font-size="11.5" fill="#454139">· bienvenida con lo último</text>
  <text x="1427" y="692" font-size="11.5" fill="#454139">· autopiloto con el vigilante</text>
  <text x="1427" y="710" font-size="11.5" fill="#454139">· bandeja demo sin SMTP</text>

