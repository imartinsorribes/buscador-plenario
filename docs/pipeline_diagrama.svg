  <!-- ============ BANDA 5: INFRAESTRUCTURA ============ -->
  <rect x="30" y="775" width="1620" height="86" fill="#2b2723" rx="6"/>
  <text x="50" y="803" font-size="12" fill="#c8a24a" letter-spacing="2">INFRAESTRUCTURA Y COSTE</text>
  <text x="50" y="828" font-size="12.5" fill="#f0ece4">Portátil RTX 3050 (4 GB): whisper int8 · pyannote · ECAPA · BGE-M3 fp16 · qwen2.5:3b de respaldo   |   Servidor UV RTX 4060 Ti (16 GB): qwen2.5:14b (trabajo) · mistral-small:24b (calidad), vía túnel SSH</text>
  <text x="50" y="849" font-size="12.5" fill="#f0ece4">Degradación automática: si el túnel cae, todo sigue con el LLM local (sin errores) · Nube solo visión (céntimos, caché por hash) · Coste recurrente por pleno: 0 € · Alternativa todo-nube evitada: 1,5-3 €/pleno</text>

  <!-- salidas destacadas -->
  <text x="30" y="905" font-size="12" fill="#7a1f2b" letter-spacing="2">SALIDAS</text>
  <text x="30" y="932" font-size="13" fill="#454139">acta PDF estilo Diario · deep-link al minuto del vídeo · correo al vecino con la cita y el minuto · ficha imprimible de manuales · manual buscable con página verificable en un clic</text>
  <text x="30" y="956" font-size="13" fill="#454139">todo verificable: cada afirmación del sistema lleva su fuente (página, minuto u orador) — la honestidad medida es parte del producto</text>
