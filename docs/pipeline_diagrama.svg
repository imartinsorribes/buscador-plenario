<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7a1f2b"/>
    </marker>
  </defs>
  <rect width="1680" height="1000" fill="#faf8f4"/>

  <!-- título -->
  <text x="840" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#222">Pipeline completo · Buscador Plenario Inteligente + Ampliación SEDIPUALBA</text>
  <text x="840" y="68" text-anchor="middle" font-size="13" fill="#8a857d">local-first · sin regex · identidades solo por etiquetado humano o huella de voz · métricas medidas — julio 2026</text>

  <!-- ============ BANDA 1: FUENTES ============ -->
  <text x="30" y="105" font-size="12" fill="#7a1f2b" letter-spacing="2">FUENTES</text>
  <rect x="30" y="115" width="380" height="78" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="220" y="140" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Vídeo del pleno (YouTube)</text>
  <text x="220" y="160" text-anchor="middle" font-size="12" fill="#6b665e">vigilante del canal: detecta el pleno nuevo cada noche</text>
  <text x="220" y="177" text-anchor="middle" font-size="12" fill="#6b665e">backfill del histórico por lotes</text>

  <rect x="440" y="115" width="330" height="78" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="605" y="140" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Manuales SEDIPUALBA (PDF)</text>
  <text x="605" y="160" text-anchor="middle" font-size="12" fill="#6b665e">13 oficiales + subida de nuevos desde la web</text>
  <text x="605" y="177" text-anchor="middle" font-size="12" fill="#6b665e">texto por páginas + capturas de pantalla</text>

  <rect x="800" y="115" width="300" height="78" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="950" y="140" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Vídeos tutoriales</text>
  <text x="950" y="160" text-anchor="middle" font-size="12" fill="#6b665e">solo se indexan por minutos</text>
  <text x="950" y="177" text-anchor="middle" font-size="12" fill="#6b665e">(no se generan manuales)</text>

  <rect x="1130" y="115" width="520" height="78" fill="#fff" stroke="#d8d2c7" rx="6"/>
  <text x="1390" y="140" text-anchor="middle" font-size="15" fill="#222" font-weight="bold">Corpus del Congreso</text>
  <text x="1390" y="160" text-anchor="middle" font-size="12" fill="#6b665e">667 plenos (legislaturas XI-XV) en JSON con orador y grupo</text>
  <text x="1390" y="177" text-anchor="middle" font-size="12" fill="#6b665e">buscador v2 con evolución temporal</text>

  <!-- ============ BANDA 2: PROCESO ============ -->
  <text x="30" y="238" font-size="12" fill="#7a1f2b" letter-spacing="2">PROCESO</text>

  <!-- pipeline pleno -->
  <rect x="30" y="250" width="600" height="150" fill="#f3f1ec" stroke="#d8d2c7" rx="6"/>
  <text x="330" y="274" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Pleno → Acta (20-45 min por pleno, 0 €)</text>
  <rect x="48" y="290" width="106" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="101" y="309" text-anchor="middle" font-size="11.5" fill="#222">descarga</text>
  <text x="101" y="324" text-anchor="middle" font-size="11" fill="#6b665e">yt-dlp</text>
  <rect x="168" y="290" width="106" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="221" y="305" text-anchor="middle" font-size="11.5" fill="#222">transcripción</text>
  <text x="221" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">whisper turbo int8</text>
  <text x="221" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">18,4× · valencià/cast.</text>
  <rect x="288" y="290" width="96" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="336" y="305" text-anchor="middle" font-size="11.5" fill="#222">corrección</text>
  <text x="336" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">lexfix + glosario</text>
  <text x="336" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">del municipio</text>
  <rect x="398" y="290" width="110" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="453" y="305" text-anchor="middle" font-size="11.5" fill="#222">voces</text>
  <text x="453" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">pyannote + huellas</text>
  <text x="453" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">ECAPA (100 % pureza)</text>
  <rect x="522" y="290" width="92" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="568" y="305" text-anchor="middle" font-size="11.5" fill="#222">acta + votos</text>
  <text x="568" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">estilo Diario · PDF</text>
  <text x="568" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">visión YOLO-pose</text>
  <line x1="154" y1="312" x2="166" y2="312" stroke="#7a1f2b" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="274" y1="312" x2="286" y2="312" stroke="#7a1f2b" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="384" y1="312" x2="396" y2="312" stroke="#7a1f2b" stroke-width="1.6" marker-end="url(#fl)"/>
  <line x1="508" y1="312" x2="520" y2="312" stroke="#7a1f2b" stroke-width="1.6" marker-end="url(#fl)"/>
  <text x="330" y="365" text-anchor="middle" font-size="11.5" fill="#6b665e">fidelidad medida: 88 % literal vs Diarios oficiales (Madrid 85,3 % a ciegas) · ASR 96,1 %</text>
  <text x="330" y="383" text-anchor="middle" font-size="11.5" fill="#6b665e">registro de voces: huella = vector local 192-d, consentida y borrable</text>

  <!-- pipeline manuales -->
  <rect x="660" y="250" width="440" height="150" fill="#f3f1ec" stroke="#d8d2c7" rx="6"/>
  <text x="880" y="274" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Documentación → índice multimodal</text>
  <rect x="678" y="290" width="126" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="741" y="305" text-anchor="middle" font-size="11.5" fill="#222">texto por páginas</text>
  <text x="741" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">fragmentos citables</text>
  <text x="741" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">manual + pág.</text>
  <rect x="818" y="290" width="136" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="886" y="305" text-anchor="middle" font-size="11.5" fill="#222">capturas descritas</text>
  <text x="886" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">gemini-flash (visión)</text>
  <text x="886" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">caché por hash: 1 pago</text>
  <rect x="968" y="290" width="114" height="44" fill="#fff" stroke="#c8c2b6" rx="4"/>
  <text x="1025" y="305" text-anchor="middle" font-size="11.5" fill="#222">vídeo transcrito</text>
  <text x="1025" y="318" text-anchor="middle" font-size="10.5" fill="#6b665e">ventanas 45-60 s</text>
  <text x="1025" y="330" text-anchor="middle" font-size="10.5" fill="#6b665e">enlace al minuto</text>
  <text x="880" y="365" text-anchor="middle" font-size="11.5" fill="#6b665e">~270 capturas descritas · recarga del índice en caliente (subir PDF sin reiniciar)</text>
  <text x="880" y="383" text-anchor="middle" font-size="11.5" fill="#6b665e">buscador de manuales: hit@6 = 87 % · 100 % página exacta en verificadas</text>

  <!-- alertas proceso -->
  <rect x="1130" y="250" width="520" height="150" fill="#f3f1ec" stroke="#d8d2c7" rx="6"/>
  <text x="1390" y="274" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">Detección de temas (Alertas)</text>
  <text x="1390" y="300" text-anchor="middle" font-size="12" fill="#454139">catálogo CERRADO de 15 temas + boletín "todos los plenos"</text>
  <text x="1390" y="318" text-anchor="middle" font-size="12" fill="#454139">frases-ancla → centroide BGE-M3 → umbral 0,57 calibrado con plenos reales</text>
  <text x="1390" y="336" text-anchor="middle" font-size="12" fill="#454139">100 % extractivo: cita literal + orador + minuto donde EMPIEZA el tema</text>
  <text x="1390" y="362" text-anchor="middle" font-size="11.5" fill="#6b665e">privacidad por diseño: imposible suscribirse a personas · doble opt-in · baja en 1 clic</text>
  <text x="1390" y="380" text-anchor="middle" font-size="11.5" fill="#6b665e">antiduplicados: regenerar un acta no reenvía correos</text>

  <!-- ============ BANDA 3: ALMACENAMIENTO ============ -->
  <text x="30" y="448" font-size="12" fill="#7a1f2b" letter-spacing="2">ALMACENAMIENTO (todo en el equipo del ayuntamiento)</text>
